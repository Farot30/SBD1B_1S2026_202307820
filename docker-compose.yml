version: "3.8"

services:

  # ─── Base de datos Oracle XE ───────────────────────────────
  oracle-db:
    build:
      context: .
      dockerfile: Dockerfile.oracle
    container_name: centros_evaluacion_db
    environment:
      ORACLE_PWD: ${ORACLE_PWD:-Admin1234}
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 30s
      retries: 40
      start_period: 380s
    networks:
      - centros_net

  # ─── API REST Node.js ──────────────────────────────────────
  api:
    build: .
    container_name: centros_evaluacion_api
    environment:
      DB_USER: ${DB_USER:-centros_db}
      DB_PASSWORD: ${DB_PASSWORD:-Admin1234}
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SERVICE: ${DB_SERVICE:-XEPDB1}
      API_PORT: ${API_PORT:-3000}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      - oracle-db
    networks:
      - centros_net
    restart: always

volumes:
  oracle_data:
    driver: local

networks:
  centros_net:
    driver: bridge